<!DOCTYPE html>
<html>
<head>
  <title>My Order - RS Food</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { margin: 0; font-family: Arial; background: #fff3e0; text-align: center; color: #222; }
    header { background: #e65100; color: white; padding: 20px; }
    #order-box { width: 88%; max-width: 500px; margin: 40px auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 2px 10px #999; }
    #status { font-size: 22px; font-weight: bold; color: #e65100; line-height: 1.5; }
    button { background: #e65100; color: white; border: none; border-radius: 8px; padding: 12px 18px; font-size: 16px; margin: 10px 5px; }
    #cancel-button { background: #c62828; display: none; }
    #cancel-note { color: #c62828; font-weight: bold; }
  </style>
</head>
<body>
  <header><h1>RS Food</h1></header>
  <div id="order-box">
    <h2>My Order</h2>
    <p id="order-id"></p>
    <p id="status">Loading...</p>
    <button id="cancel-button" onclick="cancelOrder()">Cancel Order</button>
    <p id="cancel-note"></p>
    <button onclick="window.location.href='index.html?menu=1'">Back to Menu</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAjpTACwrbATk5PU3Em1fERe5twa0Hkqi4",
      authDomain: "rs-food-3260a.firebaseapp.com",
      databaseURL: "https://rs-food-3260a-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "rs-food-3260a",
      storageBucket: "rs-food-3260a.firebasestorage.app",
      messagingSenderId: "268671249936",
      appId: "1:268671249936:web:81d69e7781e7ac1a27e495"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    const token = localStorage.getItem("rsFoodTrackingToken");
    const orderId = localStorage.getItem("rsFoodOrderId");
    const orderKey = localStorage.getItem("rsFoodOrderKey");
    let latestStatus = null;

    document.getElementById("order-id").textContent =
      orderId ? "Order ID: " + orderId : "No recent order found.";

    function customerMessage(status) {
      const messages = {
        New: "Your order has been received.",
        Accepted: "Your order has been accepted.",
        Prepared: "Your food is being prepared.",
        Ready: "Your order is ready. Delivery partner is on the way.",
        Delivered: "Delivered successfully. Thank you for ordering from RS Food!",
        Rejected: "Sorry, your order has been rejected.",
        Cancelled: "This order has been cancelled."
      };
      return messages[status] || "Current Status: " + status;
    }

    function showCancelOption() {
      const cancelButton = document.getElementById("cancel-button");
      const cancelNote = document.getElementById("cancel-note");

      if (latestStatus && latestStatus.status === "Accepted" &&
          latestStatus.acceptedAt && Date.now() <= latestStatus.acceptedAt + 180000) {
        const seconds = Math.ceil((latestStatus.acceptedAt + 180000 - Date.now()) / 1000);
        cancelButton.style.display = "inline-block";
        cancelNote.textContent = "You can cancel within " + seconds + " seconds.";
      } else {
        cancelButton.style.display = "none";
        cancelNote.textContent = latestStatus && latestStatus.status === "Accepted"
          ? "3-minute cancellation time is over." : "";
      }
    }

    window.cancelOrder = async function() {
      if (!token || !orderKey || !confirm("Do you want to cancel this order?")) return;
      try {
        await update(ref(database), {
          ["orders/" + orderKey + "/status"]: "Cancelled",
          ["orderStatus/" + token + "/status"]: "Cancelled"
        });
        alert("Your order has been cancelled.");
      } catch (error) {
        alert("Cancellation could not be completed.");
      }
    };

    if (!token) {
      document.getElementById("status").textContent = "Place an order first.";
    } else {
      onValue(ref(database, "orderStatus/" + token), function(snapshot) {
        latestStatus = snapshot.val();
        document.getElementById("status").textContent = latestStatus
          ? customerMessage(latestStatus.status)
          : "Order status not found.";
        showCancelOption();
      });
      setInterval(showCancelOption, 1000);
    }
  </script>
</body>
</html>
