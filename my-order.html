<!DOCTYPE html>
<html>
<head>
  <title>My Order - RS Food</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #fff3e0;
      text-align: center;
      color: #222;
    }

    header {
      background: #e65100;
      color: white;
      padding: 20px;
    }

    #order-box {
      width: 88%;
      max-width: 500px;
      margin: 40px auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 2px 10px #999;
    }

    #status {
      font-size: 24px;
      font-weight: bold;
      color: #e65100;
    }

    button {
      background: #e65100;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 18px;
      font-size: 16px;
      margin-top: 15px;
    }
  </style>
</head>

<body>
  <header>
    <h1>RS Food</h1>
  </header>

  <div id="order-box">
    <h2>My Order</h2>
    <p id="order-id"></p>
    <p id="status">Loading...</p>
    <button onclick="window.location.href='index.html'">
      Back to Menu
    </button>
  </div>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

    import { getDatabase, ref, onValue } from
      "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAjpTACwrbATk5PU3Em1fERe5twa0Hkqi4",
      authDomain: "rs-food-3260a.firebaseapp.com",
      databaseURL: "https://rs-food-3260a-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "rs-food-3260a",
      storageBucket: "rs-food-3260a.firebasestorage.app",
      messagingSenderId: "268671249936",
      appId: "1:268671249936:web:81d69e7781e7ac1a27e495"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    const token = localStorage.getItem("rsFoodTrackingToken");
    const orderId = localStorage.getItem("rsFoodOrderId");

    document.getElementById("order-id").textContent =
      orderId ? "Order ID: " + orderId : "No recent order found.";

    if (!token) {
      document.getElementById("status").textContent =
        "Place an order first.";
    } else {
      onValue(ref(database, "orderStatus/" + token), function(snapshot) {
        const data = snapshot.val();

        document.getElementById("status").textContent = data
          ? "Current Status: " + data.status
          : "Order status not found.";
      });
    }
  </script>
</body>
</html>
